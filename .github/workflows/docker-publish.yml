name: Docker Publish

on:
  # Run on pushes to the master branch, but only if relevant files have changed.
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'data/**'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
  # Allow the workflow to be triggered manually from the GitHub Actions UI.
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/frankenphp-docker'
    permissions:
      contents: read

    # Use a matrix strategy to build for multiple PHP versions in parallel.
    strategy:
      fail-fast: false
      matrix:
        php_version: [ '8.2', '8.3', '8.4', '8.5' ]
        debian_release: [ 'trixie' ]

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Sync supported-extensions from upstream
        run: |
          curl -fsSL https://raw.githubusercontent.com/mlocati/docker-php-extension-installer/master/data/supported-extensions \
            -o data/supported-extensions
          echo "::group::Extension compatibility check"
          echo "Checking that all installable extensions exist upstream..."
          MISSING=""
          while IFS= read -r ext; do
            [ -z "$ext" ] && continue
            if ! grep -q "^${ext} " data/supported-extensions; then
              echo "::warning::Extension '${ext}' not found in upstream supported-extensions"
              MISSING="${MISSING} ${ext}"
            fi
          done < data/installable-extensions
          if [ -n "$MISSING" ]; then
            echo "::error::Unknown extensions:${MISSING}"
            exit 1
          fi
          echo "All installable extensions are valid ✓"
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            morsalin1342/frankenphp
            easydigital/frankenphp
          # Generate tags based on the PHP version from the matrix.
          # Example for php_version=8.4: 8.4, 8.4-trixie
          # The 'latest' tag will only be applied to the PHP 8.5 build.
          # Only trixie is built. bookworm is built again only for a PHP version whose
          # base image has no trixie variant. The -trixie tags stay as aliases, and the
          # old -bookworm tags are no longer updated.
          tags: |
            type=raw,value=${{ matrix.php_version }}-${{ matrix.debian_release }}
            type=raw,value=${{ matrix.php_version }}
            type=raw,value=latest,enable=${{ matrix.php_version == '8.5' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Pass the PHP version from the matrix as a build argument.
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            DEBIAN_RELEASE=${{ matrix.debian_release }}
          # Use the tags generated by the metadata-action step.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Enable GHA caching for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update_readme:
    # This job runs only after all matrix jobs in 'build_and_publish' have succeeded.
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/frankenphp-docker'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: morsalin1342/frankenphp
          readme-filepath: ./README.dockerhub.md
          short-description: 'Production-ready FrankenPHP: custom Caddy build, 51 PHP extensions, Composer, WP-CLI, Node.js'

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: easydigital/frankenphp
          readme-filepath: ./README.dockerhub-org.md
          short-description: 'Production-ready FrankenPHP: custom Caddy build, 51 PHP extensions, Composer, WP-CLI, Node.js'
